- aid: novu:mcp-server
  name: Novu MCP Server
  description: >-
    Official Model Context Protocol server exposing the Novu REST API surface as MCP tools so AI agents
    (Claude Desktop, Cursor, agent frameworks) can trigger workflows, manage subscribers, list workflows,
    and inspect activity without bespoke wrapping. Distributed as a stdio server runnable via `npx @novu/mcp-server`.
  humanURL: https://github.com/novuhq/novu-mcp-server
